<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>北美课外活动与大厂/基金会项目库（333+）</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --warn: #d97706;
      --warn-soft: #fffbeb;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .badge-count {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger-outline {
      color: var(--danger);
      border-color: #fecaca;
      background: var(--danger-soft);
    }
    .btn-danger-outline:hover { background: #fee2e2; }
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px 80px;
    }
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 860px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 540px) {
      .controls { grid-template-columns: 1fr; }
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(37, 99, 235, 0.2);
      border-color: var(--primary);
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .card-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 700;
    }
    .card-desc {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
      font-weight: 500;
    }
    .tag.env { background: var(--primary-soft); color: var(--primary); }
    .tag.time { background: var(--warn-soft); color: var(--warn); }
    .card-meta {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .card-actions a {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .card-actions a:hover { text-decoration: underline; }
    .btn-mini {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      color: var(--muted);
    }
    .btn-mini:hover {
      color: var(--danger);
      border-color: #fecaca;
      background: var(--danger-soft);
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fab:hover { background: var(--primary-hover); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { margin: 0; font-size: 16px; }
    .close-btn {
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      padding: 0 20px;
      gap: 8px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group.full { grid-column: 1 / -1; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #334155;
    }
    .dup-warn {
      font-size: 12px;
      color: var(--warn);
      background: var(--warn-soft);
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 6px;
      display: none;
    }
    .queue-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fafc;
      font-size: 12px;
    }
    .queue-item-head {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .pill-rec { background: var(--success-soft); color: var(--success); }
    .pill-bug { background: var(--danger-soft); color: var(--danger); }
    .toast {
      position: fixed;
      bottom: 84px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 60;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>北美课外活动与大厂/基金会项目库</h1>
    <span class="badge-count" id="totalBadge">加载中...</span>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openFeedbackModal('recommend')">+ 推荐活动</button>
    <button class="btn btn-danger-outline" onclick="openFeedbackModal('bug')">! 发现数据漏洞 / 纠错</button>
    <button class="btn" onclick="openFeedbackModal('queue')">待审核队列 (<span id="queueCount">0</span>)</button>
  </div>
</header>

<div class="container">
  <div class="controls">
    <input type="search" id="searchInput" placeholder="搜索活动名称、机构、关键词（如 Google, Bezos, Quant, AI）..." />
    <select id="envFilter">
      <option value="">全部形式（线上/线下）</option>
      <option value="In Person">线下 (In Person)</option>
      <option value="Hybrid">混合 (Hybrid)</option>
      <option value="Remote/Virtual">线上 (Remote/Virtual)</option>
    </select>
    <select id="commitFilter">
      <option value="">全部周期（长短期）</option>
      <option value="Short-Term">短期 (Short-Term)</option>
      <option value="Long-Term">长期 (Long-Term)</option>
    </select>
    <select id="gradeFilter">
      <option value="">全部年级/阶段</option>
      <option value="All Grades">All Grades</option>
      <option value="9th Grade">9th Grade</option>
      <option value="10th Grade">10th Grade</option>
      <option value="11th Grade">11th Grade</option>
      <option value="12th Grade">12th Grade</option>
      <option value="Undergraduate">Undergraduate</option>
      <option value="Graduate">Graduate</option>
    </select>
  </div>

  <div class="stats-bar">
    <span id="resultStats">正在加载数据集...</span>
    <span id="loadHint"></span>
  </div>

  <div class="grid" id="cardsGrid"></div>
</div>

<button class="fab" onclick="openFeedbackModal('recommend')">
  <span>推荐活动 / 数据报错</span>
</button>

<div class="modal-backdrop" id="feedbackModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">平台互动：推荐活动与数据纠错</h2>
      <button class="close-btn" onclick="closeFeedbackModal()" aria-label="关闭">&times;</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="recommend" onclick="switchTab('recommend')">推荐新活动</button>
      <button class="tab-btn" data-tab="bug" onclick="switchTab('bug')">报告数据漏洞 / 纠错</button>
      <button class="tab-btn" data-tab="queue" onclick="switchTab('queue')">提交记录与导出 (<span id="queueTabCount">0</span>)</button>
    </div>
    <div class="modal-body">
      <!-- Tab 1: Recommend -->
      <form id="tab-recommend" onsubmit="submitRecommend(event)">
        <div class="form-grid">
          <div class="form-group full">
            <label for="recName">活动 / 项目名称 *</label>
            <input id="recName" required placeholder="例如：Microsoft Discovery Program" oninput="checkDuplicate()" />
            <div class="dup-warn" id="dupWarn"></div>
          </div>
          <div class="form-group">
            <label for="recOrgType">主办方类型 *</label>
            <select id="recOrgType" required>
              <option value="Business Corporation">大厂/企业 (Business Corporation)</option>
              <option value="Nonprofit Organization">基金会/非营利 (Nonprofit Organization)</option>
              <option value="Government Agency">国家实验室/政府 (Government Agency)</option>
              <option value="Academic Program">高校科研项目 (Academic Program)</option>
              <option value="Educational Institution">教育机构 (Educational Institution)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="recEnv">线上 / 线下形式 *</label>
            <select id="recEnv" required>
              <option value="In Person">线下 (In Person)</option>
              <option value="Remote/Virtual">线上 (Remote/Virtual)</option>
              <option value="Hybrid">混合 (Hybrid)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="recTiming">活动时间 / 时长 *</label>
            <input id="recTiming" required placeholder="例如：Summer (6 weeks) / Year-round" />
          </div>
          <div class="form-group">
            <label for="recWindow">申请窗口 / 截止时间</label>
            <input id="recWindow" placeholder="例如：Winter (Dec–Feb) / Rolling" />
          </div>
          <div class="form-group">
            <label for="recGrade">面向年级 / 阶段 *</label>
            <input id="recGrade" required placeholder="例如：11th Grade, 12th Grade, Undergraduate" />
          </div>
          <div class="form-group">
            <label for="recLink">官方链接 *</label>
            <input id="recLink" type="url" required placeholder="https://..." oninput="checkDuplicate()" />
          </div>
          <div class="form-group full">
            <label for="recDesc">项目简介与亮点 *</label>
            <textarea id="recDesc" rows="3" required placeholder="请简述项目内容、奖学金/实习待遇、申请门槛等..."></textarea>
          </div>
          <div class="form-group full">
            <label for="recContact">推荐人联系方式（可选）</label>
            <input id="recContact" placeholder="邮箱或微信号，便于核实后署名/反馈" />
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
          <button type="button" class="btn" onclick="closeFeedbackModal()">取消</button>
          <button type="submit" class="btn btn-primary">提交推荐（立即加入待审核队列）</button>
        </div>
      </form>

      <!-- Tab 2: Bug Report -->
      <form id="tab-bug" style="display:none;" onsubmit="submitBug(event)">
        <div class="form-group">
          <label for="bugTarget">涉及的活动条目 *</label>
          <select id="bugTarget" required></select>
        </div>
        <div class="form-group">
          <label for="bugType">漏洞 / 错误类型 *</label>
          <select id="bugType" required>
            <option value="活动时间或截止日有误">活动时间或截止日有误</option>
            <option value="线上/线下形式有误">线上/线下形式有误</option>
            <option value="项目已停办 / 取消">项目已停办 / 取消</option>
            <option value="官方链接失效 / 404">官方链接失效 / 404</option>
            <option value="年级 / 申请资格变更">年级 / 申请资格变更</option>
            <option value="重复条目">重复条目</option>
            <option value="其他信息错误">其他信息错误</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bugDetail">问题描述与建议修改内容 *</label>
          <textarea id="bugDetail" rows="3" required placeholder="请说明哪里不准确，以及正确的说法是什么..."></textarea>
        </div>
        <div class="form-group">
          <label for="bugEvidence">核实依据 / 官网公告链接（可选）</label>
          <input id="bugEvidence" type="url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="bugContact">反馈人联系方式（可选）</label>
          <input id="bugContact" placeholder="邮箱，方便同步处理结果" />
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
          <button type="button" class="btn" onclick="closeFeedbackModal()">取消</button>
          <button type="submit" class="btn btn-primary">提交纠错报告</button>
        </div>
      </form>

      <!-- Tab 3: Queue -->
      <div id="tab-queue" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:12px; color:var(--muted);">所有提交暂存于本地浏览器 `localStorage`，支持一键导出 JSON 合并进主数据集。</span>
          <div style="display:flex; gap:8px;">
            <button class="btn" onclick="exportQueue()">导出 JSON</button>
            <button class="btn btn-danger-outline" onclick="clearQueue()">清空</button>
          </div>
        </div>
        <div id="queueList"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let ALL_DATA = [];
  const STORAGE_KEY = "talem_north_america_feedback_v1";

  function getQueue() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch {
      return [];
    }
  }
  function saveQueue(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    updateQueueCounters();
  }
  function updateQueueCounters() {
    const q = getQueue();
    document.getElementById("queueCount").textContent = q.length;
    document.getElementById("queueTabCount").textContent = q.length;
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => { el.style.display = "none"; }, 3000);
  }

  async function init() {
    updateQueueCounters();
    try {
      const resp = await fetch("./extracurriculars.json");
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      ALL_DATA = await resp.json();
    } catch (e) {
      document.getElementById("loadHint").textContent =
        "提示：请通过本地 HTTP 服务打开（如 python3 -m http.server），以加载 extracurriculars.json";
      ALL_DATA = [];
    }
    document.getElementById("totalBadge").textContent = `共 ${ALL_DATA.length} 个项目`;
    populateBugSelect();
    render();
  }

  function populateBugSelect() {
    const sel = document.getElementById("bugTarget");
    sel.innerHTML = `<option value="">-- 请选择要纠错的活动 --</option>` +
      ALL_DATA.map(d => `<option value="${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`).join("");
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function render() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const env = document.getElementById("envFilter").value;
    const com = document.getElementById("commitFilter").value;
    const grd = document.getElementById("gradeFilter").value;

    const filtered = ALL_DATA.filter(d => {
      if (env && d.environment !== env) return false;
      if (com && d.commitment !== com) return false;
      if (grd && !(d.grade || []).includes(grd)) return false;
      if (q) {
        const hay = `${d.name} ${d.description} ${(d.subjects || []).join(" ")} ${d.type}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    document.getElementById("resultStats").textContent = `当前显示 ${filtered.length} / ${ALL_DATA.length} 条记录`;
    const grid = document.getElementById("cardsGrid");
    grid.innerHTML = filtered.slice(0, 120).map(d => `
      <div class="card">
        <div>
          <h3 class="card-title">${escapeHtml(d.name)}</h3>
          <p class="card-desc">${escapeHtml(d.description)}</p>
          <div class="tags">
            <span class="tag env">${escapeHtml(d.environment || "未知")}</span>
            <span class="tag time">${escapeHtml(d.timing || d.commitment || "未知")}</span>
            <span class="tag">${escapeHtml(d.type || "")}</span>
          </div>
        </div>
        <div>
          <div class="card-meta">
            <div><strong>申请窗口：</strong>${escapeHtml(d.application_window || "Check official site")}</div>
            <div><strong>年级/阶段：</strong>${escapeHtml((d.grade || []).join(", "))}</div>
          </div>
          <div class="card-actions">
            <a href="${escapeHtml(d.link)}" target="_blank" rel="noopener">访问官网 &rarr;</a>
            <button class="btn-mini" onclick="reportBugFor('${escapeHtml(d.id)}')">纠错 / 报错</button>
          </div>
        </div>
      </div>
    `).join("");

    if (filtered.length > 120) {
      grid.innerHTML += `<div style="grid-column:1/-1; text-align:center; padding:16px; color:var(--muted); font-size:13px;">
        仅展示前 120 条匹配结果，请使用上方搜索或筛选条件缩小范围。
      </div>`;
    }
  }

  function openFeedbackModal(tab = "recommend") {
    document.getElementById("feedbackModal").classList.add("open");
    document.getElementById("feedbackModal").setAttribute("aria-hidden", "false");
    switchTab(tab);
  }
  function closeFeedbackModal() {
    document.getElementById("feedbackModal").classList.remove("open");
    document.getElementById("feedbackModal").setAttribute("aria-hidden", "true");
  }
  function switchTab(tab) {
    ["recommend", "bug", "queue"].forEach(t => {
      document.getElementById(`tab-${t}`).style.display = t === tab ? "block" : "none";
      document.querySelector(`.tab-btn[data-tab="${t}"]`).classList.toggle("active", t === tab);
    });
    if (tab === "queue") renderQueue();
  }
  function reportBugFor(id) {
    openFeedbackModal("bug");
    document.getElementById("bugTarget").value = id;
  }

  function checkDuplicate() {
    const name = document.getElementById("recName").value.trim().toLowerCase();
    const link = document.getElementById("recLink").value.trim().toLowerCase().replace(/\/$/, "");
    const warn = document.getElementById("dupWarn");
    if (!name && !link) { warn.style.display = "none"; return; }
    const hit = ALL_DATA.find(d =>
      (name && d.name.toLowerCase().includes(name)) ||
      (link && d.link.toLowerCase().replace(/\/$/, "") === link)
    );
    if (hit) {
      warn.style.display = "block";
      warn.textContent = `提示：库中已存在相似项目「${hit.name}」，如信息有误可直接切换至“报告数据漏洞”进行纠错。`;
    } else {
      warn.style.display = "none";
    }
  }

  function submitRecommend(e) {
    e.preventDefault();
    const entry = {
      kind: "recommendation",
      submitted_at: new Date().toISOString(),
      payload: {
        id: "user-rec-" + Date.now(),
        name: document.getElementById("recName").value.trim(),
        type: document.getElementById("recOrgType").value,
        environment: document.getElementById("recEnv").value,
        timing: document.getElementById("recTiming").value.trim(),
        application_window: document.getElementById("recWindow").value.trim() || "Check official site",
        grade: document.getElementById("recGrade").value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
        link: document.getElementById("recLink").value.trim(),
        description: document.getElementById("recDesc").value.trim(),
        contact: document.getElementById("recContact").value.trim(),
      }
    };
    const q = getQueue();
    q.unshift(entry);
    saveQueue(q);
    e.target.reset();
    document.getElementById("dupWarn").style.display = "none";
    switchTab("queue");
    showToast("感谢推荐！已加入待审核队列");
  }

  function submitBug(e) {
    e.preventDefault();
    const targetId = document.getElementById("bugTarget").value;
    const targetObj = ALL_DATA.find(d => d.id === targetId);
    const entry = {
      kind: "bug_report",
      submitted_at: new Date().toISOString(),
      payload: {
        target_id: targetId,
        target_name: targetObj ? targetObj.name : targetId,
        issue_type: document.getElementById("bugType").value,
        detail: document.getElementById("bugDetail").value.trim(),
        evidence_url: document.getElementById("bugEvidence").value.trim(),
        contact: document.getElementById("bugContact").value.trim(),
      }
    };
    const q = getQueue();
    q.unshift(entry);
    saveQueue(q);
    e.target.reset();
    switchTab("queue");
    showToast("纠错报告已记录，感谢帮助完善数据集！");
  }

  function renderQueue() {
    const q = getQueue();
    const container = document.getElementById("queueList");
    if (!q.length) {
      container.innerHTML = `<p style="text-align:center; color:var(--muted); font-size:13px; padding:24px 0;">暂无提交记录。</p>`;
      return;
    }
    container.innerHTML = q.map((item, idx) => {
      const isRec = item.kind === "recommendation";
      const p = item.payload;
      return `
        <div class="queue-item">
          <div class="queue-item-head">
            <span>${isRec ? escapeHtml(p.name) : escapeHtml(p.target_name)}</span>
            <span class="pill ${isRec ? "pill-rec" : "pill-bug"}">${isRec ? "新活动推荐" : escapeHtml(p.issue_type)}</span>
          </div>
          <div style="color:var(--muted); margin-bottom:4px;">
            ${isRec
              ? `${escapeHtml(p.environment)} · ${escapeHtml(p.timing)} · <a href="${escapeHtml(p.link)}" target="_blank">官网</a>`
              : escapeHtml(p.detail)}
          </div>
          <div style="display:flex; justify-content:space-between; color:#94a3b8;">
            <span>${new Date(item.submitted_at).toLocaleString()}</span>
            <button class="btn-mini" onclick="removeQueueItem(${idx})">删除</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function removeQueueItem(idx) {
    const q = getQueue();
    q.splice(idx, 1);
    saveQueue(q);
    renderQueue();
  }
  function clearQueue() {
    if (!confirm("确定清空所有本地提交记录吗？")) return;
    saveQueue([]);
    renderQueue();
  }
  function exportQueue() {
    const q = getQueue();
    const blob = new Blob([JSON.stringify(q, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `talem-feedback-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  ["searchInput", "envFilter", "commitFilter", "gradeFilter"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
    document.getElementById(id).addEventListener("change", render);
  });
  document.getElementById("feedbackModal").addEventListener("click", (e) => {
    if (e.target.id === "feedbackModal") closeFeedbackModal();
  });

  init();
</script>
</body>
</html>
